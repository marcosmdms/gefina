<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gegina - Faturas</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-8">

  <div class="max-w-4xl mx-auto">

    <h1 class="text-3xl font-bold mb-6">
      Faturas
    </h1>

    <div class="overflow-x-auto bg-white rounded-lg shadow">

      <table class="w-full text-left">

        <thead class="bg-gray-800 text-white">
          <tr>
            <th class="px-6 py-3">ID</th>
            <th class="px-6 py-3">Cliente</th>
            <th class="px-6 py-3">Valor</th>
            <th class="px-6 py-3">Emissão</th>
            <th class="px-6 py-3">Vencimento</th>
            <th class="px-6 py-3">Situação</th>
          </tr>
        </thead>

        <tbody>

        </tbody>

      </table>

    </div>

  </div>

  <script>
    const invoices = [
      {
        id: 1,
        amount: 125000,
        status: "pending",
        issueDate: "2026-06-01",
        dueDate: "2026-11-15",
        customer: {
          id: 1,
          name: "Construtora Meridiano",
          email: "contato@meridiano.com.br"
        }
      },
      {
        id: 2,
        amount: 348000,
        status: "paid",
        issueDate: "2026-05-12",
        dueDate: "2026-06-11",
        customer: {
          id: 1,
          name: "Construtora Meridiano",
          email: "contato@meridiano.com.br"
        }
      },
      {
        id: 3,
        amount: 96500,
        status: "pending",
        issueDate: "2026-06-20",
        dueDate: "2026-07-20",
        customer: {
          id: 2,
          name: "Gráfica Aurora",
          email: "contato@graficaaurora.com.br"
        }
      }
    ];

    const tableBody = document.querySelector("tbody");

    function statusLabel(status) {
      if (status != "paid") return "Pendente";
      return "Pago";
    }

    function addCell(row, value) {
      const cell = document.createElement("td");

      cell.textContent = value;
      cell.className = "px-6 py-4";

      row.appendChild(cell);
    }

    for (let i = 0; i < invoices.length; i++) {

      const invoice = invoices[i];
      const row = document.createElement("tr");

      row.className = "border-b hover:bg-gray-100";

      addCell(row, invoice.id);
      addCell(row, invoice.customer.name);
      addCell(row, `R$ ${invoice.amount}`);
      addCell(row, invoice.issueDate);
      addCell(row, invoice.dueDate);
      addCell(row, statusLabel(invoice.status));

      tableBody.appendChild(row);
    }
  </script>

</body>

</html>
